[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vacan"
version = "0.2.0"
description = "Visual analytics for diagnosing DRL navigation decisions"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary - research prototype" }
dependencies = ["PyYAML==6.0.3"]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]
rl = [
  "gymnasium==0.29.1",
  "numpy==1.26.4",
  "stable-baselines3==2.3.2",
  "sb3-contrib==2.3.0",
  "tensorboard==2.17.1",
]
simulation = [
  "numpy==1.26.4",
  "scipy==1.17.1",
  "opencv-python==4.11.0.86",
  "matplotlib==3.11.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: exercises a complete Stage 1 simulation episode"]

[tool.ruff]
line-length = 100
target-version = "py311"
