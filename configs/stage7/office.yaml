schema_version: 1
scenario: office
world_frame: isaac_world_enu
stage6_config: ../stage6/office.yaml
stage6_artifact: ../../reproduction/office/stage6/matched-seed15101
policy_checkpoint: ../../checkpoints/stage5/office/recurrent_ppo.zip
policy: {frozen: true, inference: deterministic}
seed: 15101
comparison_tolerance: 1.0e-6
grid:
  origin_xy: [-12.0, -12.0]
  size_xy: [24.0, 24.0]
  resolution_m: 4.0
interventions:
  - id: full_congestion
    factor: congestion
    type: full_information
    start_time_s: 0.0
    end_time_s: 120.0
    scope: {}
    measurement_convention: full_grid_count
  - id: full_intention
    factor: intention
    type: full_information
    start_time_s: 0.0
    end_time_s: 120.0
    ground_truth_reference: pegasus_controller_current_destination
  - id: congestion_injected_error_3_3
    factor: congestion
    type: overestimate
    start_time_s: 0.0
    end_time_s: 0.0
    scope: {cells: [[3, 3]]}
    delta: 3
  - id: cctv_counterfactual_corruption_2_4
    factor: congestion
    type: cctv_corruption
    start_time_s: 0.0
    end_time_s: 12.0
    scope: {cells: [[2, 4]]}
    value: 6
    measurement_convention: counterfactual_cctv_corruption
  - id: restore_missing_cctv_coverage_3_3
    factor: congestion
    type: coverage_restoration
    start_time_s: 0.0
    end_time_s: 120.0
    scope: {cells: [[3, 3]]}
    measurement_convention: counterfactual_additional_coverage
  - id: intention_injected_error_office_04
    factor: intention
    type: incorrect_destination
    start_time_s: 0.0
    end_time_s: 0.0
    pedestrian_id: office_04
    destination_grid: [2, 2]
  - id: no_op
    factor: congestion
    type: no_op
    start_time_s: 0.0
    end_time_s: 120.0
    scope: {}
experiments:
  - id: full_information
    intervention_ids: [full_congestion, full_intention]
    baseline_id: original
    role: full_information_policy_reference
  - id: congestion_error
    intervention_ids: [full_congestion, full_intention, congestion_injected_error_3_3]
    baseline_id: full_information
  - id: intention_error
    intervention_ids: [full_congestion, full_intention, intention_injected_error_office_04]
    baseline_id: full_information
  - id: combined_error
    intervention_ids: [full_congestion, full_intention, congestion_injected_error_3_3, intention_injected_error_office_04]
    baseline_id: full_information
  - id: cctv_congestion_error
    intervention_ids: [cctv_counterfactual_corruption_2_4]
    baseline_id: original
    case_study_id: case_1_2_cctv_sensing_error
  - id: coverage_restored
    intervention_ids: [restore_missing_cctv_coverage_3_3]
    baseline_id: original
    role: case_1_1_correct_coverage
  - id: correct_intention_partial
    intervention_ids: [full_intention]
    baseline_id: original
    role: case_2_correct_input
  - id: intention_freshness_error
    intervention_ids: [full_intention, intention_injected_error_office_04]
    baseline_id: correct_intention_partial
    case_study_id: case_2_intention_freshness_error
  - {id: no_op, intervention_ids: [no_op], baseline_id: original}
case_studies:
  trajectory_divergence_m: 0.75
  action_divergence_l2: 0.05
  minimum_cost_increase: 1.0e-6
  crowd_clip: 6.0
  case_1_1:
    correct_branch: coverage_restored
    error_branch: original
    affected_cells: [[3, 3]]
  case_1_2:
    correct_branch: original
    error_branch: cctv_congestion_error
    affected_cells: [[2, 4]]
  case_2:
    correct_branch: correct_intention_partial
    error_branch: intention_freshness_error
    affected_cells: [[4, 3], [2, 2]]
  case_3:
    drl_branch: full_information
    reference: stage6_time_expanded_astar
