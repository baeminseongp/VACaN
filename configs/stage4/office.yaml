reward: {progress: 2.0, goal: 25.0, collision: 20.0, social: 1.0, time: 0.01, smooth: 0.05, personal_space_m: 0.8}
episode: {max_duration_s: 120.0, goal_tolerance_m: 0.5, collision_termination: true}
teleop_mapping:
