  depth_frequency_hz: 2.0
  viewport_frequency_hz: 20.0
  depth_max_range_m: 12.0
  depth_ray_stride: 4
  camera_offset_xyz_m: [0.30, 0.0, 0.65]
  max_duration_s: 600.0
  save_depth_frames: false
